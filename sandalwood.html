<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandalwood in 3 Pictures</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #facc15; /* Sandalwood Yellow */
            --accent-hover: #eab308;
            --answer-bg: #451a03; 
            --answer-border: #b45309;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            background: var(--card-bg);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .emoji-display {
            font-size: 4.5rem;
            letter-spacing: 15px;
            margin: 30px 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            animation: fadeIn 0.5s ease-out;
        }

        .hint-text {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-bottom: 30px;
            font-style: italic;
            min-height: 60px;
        }

        .answer-container {
            display: none;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--answer-bg);
            border: 2px solid var(--answer-border);
            border-radius: 8px;
            animation: scaleUp 0.4s ease-out;
        }

        .final-answer {
            font-size: 2rem;
            color: var(--accent);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
        }

        .btn-reveal {
            background-color: var(--accent);
            color: #451a03;
        }

        .btn-reveal:hover { background-color: var(--accent-hover); transform: translateY(-2px); }

        .btn-next {
            background-color: var(--text-main);
            color: var(--card-bg);
            display: none; 
            width: 100%;
        }

        .btn-next:hover { background-color: #cbd5e1; }

        .progress {
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Nav back to home */
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: var(--accent);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    </style>
</head>
<body>

    <div class="game-container">
        <h1>Kannada Plot in 3 Pictures</h1>
        <div class="subtitle">Can you guess the Sandalwood movie from the emojis?</div>
        
        <div class="emoji-display" id="emoji-text"></div>
        <div class="hint-text" id="hint-text"></div>

        <div class="answer-container" id="answer-section">
            <div class="subtitle" style="margin-bottom: 5px;">The movie is:</div>
            <div class="final-answer" id="answer-text"></div>
        </div>

        <div class="controls" id="controls">
            <button class="btn-reveal" id="btn-reveal" onclick="showAnswer()">Reveal Answer</button>
        </div>
        <button class="btn-next" id="btn-next" onclick="nextRiddle()">Next Movie ➔</button>

        <div class="progress" id="progress-text"></div>
        
        <a href="index.html" class="back-link">← Back to Arcade</a>
    </div>

    <script>
        const gameData = [
            {
                emojis: "🐗 🌲 🔥",
                hint: "A fiery clash between local folklore, a forest officer, and a greedy landlord.",
                movie: "Kantara"
            },
            {
                emojis: "⛏️ 🪙 🔫",
                hint: "A young man's promise to his dying mother leads him to conquer the bloodiest gold mine in the country.",
                movie: "KGF"
            },
            {
                emojis: "💊 😴 📽️",
                hint: "An usher at a local theater takes a mysterious pill that blurs the lines between his reality and a glamorous dream life.",
                movie: "Lucia"
            },
            {
                emojis: "🎻 🏔️ ☔",
                hint: "A tragic accident on a rainy cliff during a vacation turns into a psychological game of obsession and betrayal.",
                movie: "Amrutha Varshini"
            },
            
            {
                emojis: "🛣️ 🧱 👻",
                hint: "A journalist investigates the mysterious deaths of motorists who illegally move concrete dividers on a city flyover.",
                movie: "U-Turn"
            },
            {
                emojis: "🕵️‍♂️ 🥕 📼",
                hint: "A quirky, carrot-eating retro detective gets his big break investigating a robbery at a local police station.",
                movie: "Bell Bottom"
            },
            {
                emojis: "🦴 👮 📰",
                hint: "A bored traffic cop stumbles upon skulls near a metro construction site, leading him to crack a decades-old cold case.",
                movie: "Kavaludaari"
            },
            {
                emojis: "🚗 🌲 👹",
                hint: "A novelist's journey to his wife's ancestral village uncovers dark secrets involving a local postmaster and Yakshagana.",
                movie: "Rangitaranga"
            },
            {
                emojis: "🚂 📝 🔪",
                hint: "A sharp-minded detective with a troubled past investigates a high-profile murder at a resort.",
                movie: "Shivaji Surathkal"
            },
            {
                emojis: "👨‍⚖️ 🚕 💼",
                hint: "A smart lawyer reopens a closed murder case to prove the innocence of a falsely accused taxi driver.",
                movie: "Birbal"
            },
            {
                emojis: "🤕 🧠 🎭",
                hint: "After a head injury, a man loses his memory just before his wedding, leading his friends to desperately cover it up.",
                movie: "Kwatle Sathisha"
            }
        ];

        let currentIndex = 0;

        const emojiText = document.getElementById('emoji-text');
        const hintText = document.getElementById('hint-text');
        const answerSection = document.getElementById('answer-section');
        const answerText = document.getElementById('answer-text');
        const btnReveal = document.getElementById('btn-reveal');
        const btnNext = document.getElementById('btn-next');
        const controlsDiv = document.getElementById('controls');
        const progressText = document.getElementById('progress-text');

        function loadRiddle(index) {
            const currentItem = gameData[index];
            
            answerSection.style.display = 'none';
            btnNext.style.display = 'none';
            controlsDiv.style.display = 'flex';
            btnReveal.style.display = 'block';

            emojiText.textContent = currentItem.emojis;
            hintText.textContent = `"${currentItem.hint}"`;
            
            emojiText.style.animation = 'none';
            emojiText.offsetHeight;
            emojiText.style.animation = null; 

            answerText.textContent = currentItem.movie;
            progressText.textContent = `Movie ${index + 1} of ${gameData.length}`;
        }

        function showAnswer() {
            answerSection.style.display = 'block';
            controlsDiv.style.display = 'none';
            btnNext.style.display = 'block';
        }

        function nextRiddle() {
            if (currentIndex < gameData.length - 1) {
                currentIndex++;
                loadRiddle(currentIndex);
            } else {
                document.querySelector('.game-container').innerHTML = `
                    <h1 style="font-size: 2.5rem;">Sandalwood Expert!</h1>
                    <p class="subtitle" style="margin-top: 20px;">You solved all the Kannada movie plots.</p>
                    <button class="btn-reveal" style="margin-top: 30px;" onclick="location.reload()">Play Again</button>
                    <br><br>
                    <a href="index.html" class="back-link">← Back to Arcade</a>
                `;
            }
        }

        window.onload = () => {
            loadRiddle(currentIndex);
        };
    </script>
</body>
</html>
